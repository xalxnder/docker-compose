services:
  infisical-redis:
    image: redis:8.10.2
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1gb
        reservations:
           cpus: "0.25"
           memory: 256mb
    container_name: infisical-redis
    networks:
      - traefik_proxy
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data
