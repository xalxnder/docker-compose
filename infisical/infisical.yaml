name: infisical-stack
services:
  infisical:
    networks:
      - traefik_proxy
    container_name: infisical
    restart: unless-stopped
    # depends_on:
      # db:
      #   condition: service_healthy
      # redis:
      #   condition: service_started
    image: infisical/infisical:v0.167.4
    pull_policy: always
    environment:
      - NODE_ENV=production
      - SMTP_IGNORE_TLS=true
      - SMTP_FROM_NAME=Infisical
      - SMTP_PORT=587
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      - REDIS_URL=${REDIS_URL:?REDIS_URL must be set}
      - SITE_URL=${SITE_URL:?SITE_URL must be set}
      - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS:?SMTP_FROM_ADDRESS must be set}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      - DB_CONNECTION_URI=${DB_CONNECTION_URI:?DB_CONNECTION_URI must be set}
    labels:
      - traefik.enable=true
      - traefik.http.routers.infisical.rule=Host(`infisical.xalab.io`)
      - traefik.http.routers.infisical.entrypoints=websecure
      - traefik.http.routers.infisical.tls.certresolver=cloudflare
      - traefik.http.services.infisical.loadbalancer.server.port=8080
